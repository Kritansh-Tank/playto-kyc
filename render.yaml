services:
  - type: web
    name: playto-kyc-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate && python backend/seed.py
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://playto-kyc.onrender.com"
      - key: PYTHONPATH
        value: "backend"

  - type: web
    name: playto-kyc
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://playto-kyc-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
